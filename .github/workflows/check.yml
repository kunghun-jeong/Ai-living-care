name: check

# PR 에서 도는 진짜 관문. pre-commit 훅은 설치 안 한 사람에게는 없는 것과 같고
# SKIP_ANCHOR 로 넘길 수도 있다 — 그래서 병합 전에 여기서 한 번 더 본다.

on:
  pull_request:
  push:
    # master 는 협업자가 직접 푸시하는 통합 브랜치다 —
    # PR 을 안 거치므로 여기서 안 돌면 검사 없이 흘러간다.
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 앵커 — CLAUDE.md 가 자기 디렉터리를 가리키는가
        run: python3 anchor.py --strict   # PR 에서는 알림도 통과시키지 않는다

      - name: 구조 — SOT.md 규범
        run: python3 sot_audit.py

      - name: 구문
        run: python3 -m compileall -q $(git ls-files '*.py')

      - name: 셸 구문
        run: for s in $(git ls-files '*.sh'); do bash -n "$s"; done

  # 앵커는 「가리키는 것이 실재하는가」를 본다. **병합은 파일을 남긴 채 내용만 지운다** —
  # 원리적으로 안 잡힌다. `master` 가 둘 이상이 직접 푸시하는 통합 브랜치가 된 이상
  # 병합 해소가 남의 커밋을 되돌리는 것은 시간 문제다.
  #
  # ⚠ 정직하게: 이 검사는 fda5e22 「유실 복구」를 잡지 못했을 것이다. 그건 커밋된 내용이
  # 되돌아간 게 아니라 **작업 트리에만 있던 것이 두 번의 병합을 건너며 커밋되지 않은** 경우라
  # 커밋 간 diff 에 흔적이 없다 (3aae556 은 두 부모 대비 순삭제 0). 그쪽은 `make status` 의
  # 「커밋 안 된 변경」이 본다. 여기서 보는 것은 그 옆의 다른 실패다.
  #
  # **막지 않는다** — 문서를 크게 정리하는 것은 정상이고, 그것까지 막으면 정리를 벌하는 셈이다.
  loss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 기준 커밋과 비교해야 한다

      - name: 보호 문서 순삭제 경고
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ -z "$BASE" ] || [ "$BASE" = "$zero" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "비교 기준 없음 (새 브랜치) — 건너뛴다"; exit 0
          fi
          PROTECTED=".githooks CLAUDE.md CONTRIBUTING.md Makefile README.md SOT.md \
                     anchor.py sot_audit.py docs/doc-map.md docs/harness.md docs/harness"
          net=$(git diff --numstat "$BASE" HEAD -- $PROTECTED \
                | awk '{a+=$1; d+=$2} END {print (d-a)+0}')
          echo "보호 문서 순삭제 ${net}줄 (기준 $(git rev-parse --short "$BASE"))"
          if [ "$net" -ge 20 ]; then
            git diff --stat "$BASE" HEAD -- $PROTECTED
            echo "::warning::보호 문서에서 순삭제 ${net}줄. 의도한 정리면 PR 에 한 줄 적고 넘어간다. 병합으로 되돌아간 것이라면 지금이 알아챌 유일한 지점이다"
          fi

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install "numpy>=1.26,<2" opencv-python-headless

      # 논문·제안서가 인용하는 93.6% 가 좌표·CAM_RANGE 변경으로 조용히 바뀌는 것을 본다.
      # **막지 않는다** — 순찰 로직을 실험적으로 바꾸는 것이 Phase 0 의 일이고,
      # 탐색 중에 수치가 내려가는 것은 정상이다. 논문에 수치를 인용하기 전에 여기를 본다.
      # Phase 1(견고화)에 들어가면 하한으로 되돌린다.
      - name: 순찰 커버리지 (기준선 90% · 경고)
        run: |
          cd tools/limo-patrol-viz
          ./run_coverage.sh | tee /tmp/cov.txt | tail -6
          pct=$(grep -o '= [0-9.]*%' /tmp/cov.txt | tail -1 | tr -dc '0-9.')
          echo "커버리지 = ${pct}%"
          python3 -c "
import sys
p = float('${pct}')
if p < 90.0:
    print(f'::warning::순찰 커버리지 {p}% — 기준선 90% 아래다. 의도한 변경인지 PR 에 적을 것')
else:
    print(f'커버리지 {p}% — 기준선 이상')
"
